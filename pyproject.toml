[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "igloo-notify"
version = "0.3.0"
description = "Bidirectional ntfy.sh notification and command bridge skill for Codex and Antigravity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kirill Talanov", email = "kirill@talanov.ca" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
